name: Publish Docara Site

# Builds the SitePack documentation (docara/) with Docara 3 and publishes it on
# GitHub Pages. The build takes its base_url and site_url from the Pages
# configuration, so the same workflow serves the project path
# (https://simai.github.io/sitepack/) and a custom domain
# (https://sitepack.simai.io/). site_url adds sitemap.xml, robots.txt,
# llms.txt, absolute canonical addresses and Open Graph tags.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install Docara
        working-directory: docara
        run: composer install --no-interaction --prefer-dist --no-progress

      # base_path is "/sitepack" for the project site and empty for a custom
      # domain; base_url is the full address. The committed docara.json keeps
      # "/" and no site_url for local builds.
      - name: Set the site base URL and site URL
        working-directory: docara
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          jq --arg base "${BASE_PATH%/}/" --arg site "${SITE_URL%/}/" \
            '.base_url = $base | .site_url = $site' docara.json > docara.json.pages
          mv docara.json.pages docara.json
          jq -r '.base_url, .site_url' docara.json

      - name: Build Docara site
        working-directory: docara
        run: php vendor/bin/docara build production

      - name: Verify the built site
        working-directory: docara
        run: php vendor/bin/docara verify-static build_production

      # Docara 3 page addresses are lower case and its redirects.json accepts
      # only those. legacy-redirects.json maps the Docara 1.x upper-case
      # addresses (SPEC, CHANGELOG, LLM_README, ...) to the new pages.
      - name: Write redirects for the Docara 1.x addresses
        working-directory: docara
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import html, json, os
          from pathlib import Path

          base = os.environ.get("BASE_PATH", "").rstrip("/")
          root = Path("build_production")
          for source, target in json.loads(Path("legacy-redirects.json").read_text()).items():
              assert (root / target / "index.html").is_file(), target
              page = root / source / "index.html"
              assert not page.exists(), source
              url = html.escape(f"{base}/{target}/", quote=True)
              page.parent.mkdir(parents=True, exist_ok=True)
              page.write_text(
                  '<!doctype html><html><head><meta charset="utf-8">'
                  f'<meta name="robots" content="noindex"><link rel="canonical" href="{url}">'
                  f'<meta http-equiv="refresh" content="0; url={url}"><title>Page moved</title></head>'
                  f'<body><a href="{url}">{url}</a></body></html>\n',
                  encoding="utf-8",
              )
          PY

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docara/build_production

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
